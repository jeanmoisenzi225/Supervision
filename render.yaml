# Blueprint Render de la Supervision : projet dédié, indépendant des applis
# surveillées (si MGA tombe, la supervision reste en ligne pour le dire).
#
# Un seul service web : l'API sert aussi l'interface (même adresse), et les
# clés des notifications sont générées au premier démarrage. Seules valeurs
# demandées à la création : ADMIN_EMAIL et ADMIN_PASSWORD.
#
# L'API doit tourner en continu pour vérifier les applis toutes les minutes :
# plan Starter obligatoire (l'offre gratuite se met en veille).
projects:
  - name: Supervision
    environments:
      - name: production
        databases:
          - name: supervision-db
            plan: basic-256mb
            databaseName: supervision
            user: supervision_user

        services:
          - type: web
            name: supervision
            runtime: node
            plan: starter
            buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate && npm run build
            startCommand: cd backend && npx prisma migrate deploy && npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_VERSION
                value: 22
              - key: DATABASE_URL
                fromDatabase:
                  name: supervision-db
                  property: connectionString
              - key: JWT_SECRET
                generateValue: true
              # Super administrateur, créé au premier démarrage seulement.
              - key: ADMIN_EMAIL
                sync: false
              - key: ADMIN_PASSWORD
                sync: false
              # Jetons d'envoi des journaux, un par appli (voir docs/integration.md).
              - key: MGA_INGEST_TOKEN
                generateValue: true
              - key: YIRI_INGEST_TOKEN
                generateValue: true
              - key: PROCEDIA_INGEST_TOKEN
                generateValue: true
              - key: MY_FAMILY_INGEST_TOKEN
                generateValue: true
